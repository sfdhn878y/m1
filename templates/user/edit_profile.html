{% extends 'base.html' %}
{% block content %}
    <style>
        .card {
            width: 100%;
            max-width: 420px;
            margin: 24px auto;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 28px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 16px; color: #333; font-size: 14px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { min-height: 90px; resize: vertical; }
        button {
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 6px;
            background: #333;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #555; }
        .back { display: block; margin-top: 14px; text-align: center; font-size: 14px; color: #333; }
    </style>

    <form class="card" action="/user/edit_profile" method="post">
        <h1>Edit Profile</h1>
        <p>Update your address, phone, and past experience.</p>

        <label for="address">Address</label>
        <input type="text" name="address" id="address" required value="{{ profile.address }}">

        <label for="phone">Phone</label>
        <input type="text" name="phone" id="phone" required value="{{ profile.phone }}">

        <label for="past_experience">Past Experience</label>
        <textarea name="past_experience" id="past_experience" required>{{ profile.past_experience }}</textarea>

        <button type="submit">Save profile</button>
        <a class="back" href="/user/user_dashboard">Back to dashboard</a>
    </form>
{% endblock %}

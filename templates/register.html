<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e4e7eb;
            border-radius: 8px;
            padding: 28px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 20px; color: #52606d; }
        label { display: block; margin-bottom: 6px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 14px;
            border: 1px solid #cbd2d9;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 6px;
            background: #1d4ed8;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .link { margin-top: 16px; text-align: center; font-size: 14px; }
        a { color: #1d4ed8; }
    </style>
</head>
<body>
    <form class="card" action="/register" method="post">
        <h1>Create account</h1>
        <p>Register to continue to the exam portal.</p>

        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <label for="role">Role</label>
        <select id="role" name="role" required>
            <option value="student">Student</option>
            <option value="examinor">Examiner</option>
          
        </select>

        <button type="submit">Register</button>
        <div class="link">Already have an account? <a href="/login">Log in</a></div>
    </form>
</body>
</html>

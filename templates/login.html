{% extends 'base.html' %}
{% block content %}
    <style>
        * { box-sizing: border-box; }
     
        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #e4e7eb;
            border-radius: 8px;
            padding: 28px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 20px; color: #52606d; }
        label { display: block; margin-bottom: 6px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 14px;
            border: 1px solid #cbd2d9;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 11px;
            border: 0;
            border-radius: 6px;
            background: #1d4ed8;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
        }
        .error {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fde8e8;
            color: #9b1c1c;
            font-size: 14px;
        }
        .link { margin-top: 16px; text-align: center; font-size: 14px; }
        a { color: #1d4ed8; }
    </style>
</head>
<body>
    <form class="card" action="/login" method="post">
        <h1>Log in</h1>
        <p>Use your email and password to continue.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button type="submit">Log in</button>
        <div class="link">New here? <a href="/register">Create an account</a></div>
    </form>
</body>
{% endblock %}

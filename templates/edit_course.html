<form action="/edit_course/{{ course.id }}" method="post">
    <input type="text" name="course_name" id="course_name" value="{{ course.coures_name }}">
    <input type="text" name="course_description" id="course_description" value="{{ course.coures_description }}">
    <input type="text" name="course_duration" id="course_duration" value="{{ course.course_duration }}">
    <button type="submit">Update</button>
</form>

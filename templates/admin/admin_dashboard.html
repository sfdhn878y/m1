{% extends 'base.html' %}
{% block content %}
    <style>
        .box {
            max-width: 720px;
            margin: 24px auto;
            padding: 20px;
            border: 1px solid #ccc;
            background: #fff;
        }
        h1 { margin: 0 0 8px; font-size: 26px; }
        p { margin: 0 0 16px; color: #333; }
        .links { display: flex; gap: 10px; flex-wrap: wrap; }
        .links a {
            display: inline-block;
            padding: 10px 14px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }
        .links a:hover { background: #555; }
        .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .stat {
            flex: 1;
            min-width: 120px;
            border: 1px solid #ccc;
            padding: 12px;
            border-radius: 4px;
        }
        .stat span { display: block; font-size: 22px; font-weight: bold; }
        .stat small { color: #333; }
    </style>

    <div class="box">
        <h1>Admin Dashboard</h1>
        <p>Create a course or an exam from here.</p>
        <div class="stats">
            <div class="stat"><span>{{ course_count }}</span><small>Courses</small></div>
            <div class="stat"><span>{{ exam_count }}</span><small>Exams</small></div>
            <div class="stat"><span>{{ student_count }}</span><small>Students</small></div>
            <div class="stat"><span>{{ examinor_count }}</span><small>Examiners</small></div>
        </div>
        <div class="links">
            <a href="/admin/create_course">Create course</a>
            <a href="/admin/create_exam">Create exam</a>
            <a href="/admin/manage_users">Manage users</a>
        </div>
    </div>
{% endblock %}
